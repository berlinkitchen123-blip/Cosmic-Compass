
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Compass | Astrology & Numerology AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            background-attachment: fixed;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-dark {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
    
    <!-- Import Map for Module Resolution -->
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "firebase/app": "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js",
        "firebase/": "https://esm.sh/firebase@^12.7.0/"
      }
    }
    </script>

    <!-- Global Shim for process.env (Required for Browser-only environments) -->
    <script>
      window.process = window.process || { env: {} };
    </script>

    <!-- Babel Standalone for In-Browser JSX/TS Transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="text-gray-100 min-h-screen">
    <div id="root"></div>
    <!-- Load index.tsx using Babel as an ES Module -->
    <!-- Changed src="/index.tsx" to "index.tsx" to fix 404 on subdirectories -->
    <script 
        type="text/babel" 
        data-type="module" 
        data-presets="typescript,react" 
        src="index.tsx"
    ></script>
</body>
</html>
