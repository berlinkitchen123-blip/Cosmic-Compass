
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Compass | Akashic AI Oracle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,700;1,700;1,900&display=swap" rel="stylesheet">
    <script>
        // Polyfill process for libraries that expect it
        window.process = { env: { NODE_ENV: 'production' } };
    </script>
<link rel="stylesheet" href="/src/index.css">
</head>
<body>
    <div id="stars-container" class="fixed inset-0 z-0 pointer-events-none opacity-50"></div>
    <div id="root"></div>
    <script>
        const container = document.getElementById('stars-container');
        if (container) {
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'absolute bg-white rounded-full twinkle';
                const size = Math.random() * 2 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }
    </script>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
