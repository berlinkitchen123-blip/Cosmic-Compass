<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Compass | Akashic AI Oracle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,700;1,700;1,900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #6366f1; --accent-glow: rgba(99, 102, 241, 0.4); }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #020617, #0f172a, #020617);
            background-attachment: fixed;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .willpower-glow { box-shadow: 0 0 20px var(--accent-glow); }
        .twinkle { animation: twinkle 4s ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }
        .glow-border { border: 1px solid rgba(99, 102, 241, 0.2); }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.468.0",
    "firebase/app": "https://esm.sh/firebase@12.7.0/app",
    "firebase/database": "https://esm.sh/firebase@12.7.0/database",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="stars-container" class="fixed inset-0 z-0 pointer-events-none opacity-50"></div>
    <div id="root"></div>
    <script>
        const container = document.getElementById('stars-container');
        if (container) {
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'absolute bg-white rounded-full twinkle';
                const size = Math.random() * 2 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }
    </script>
    <script type="text/babel" data-type="module" data-presets="react,typescript" src="index.tsx"></script>
</body>
</html>
